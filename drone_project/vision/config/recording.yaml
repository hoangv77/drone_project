directory: ~/drone-recordings
bag: true
video: false
# Only currently published entries are recorded. No raw camera frames by default.
topics:
  - /drone/state
  - /drone/safety_status
  - /drone/mission_state
  - /fmu/out/vehicle_status_v4
  - /fmu/out/vehicle_local_position_v1
  - /fmu/out/vehicle_odometry
  - /fmu/out/vehicle_gnss
  - /fmu/out/vehicle_land_detected
  - /fmu/out/battery_status_v1
  - /fmu/out/failsafe_flags
  - /vision/detections
  - /camera/camera_info
  - /vision/camera_info
  - /diagnostics
  - /tf
  - /tf_static
split_mib: 128
session_mib: 2048
total_mib: 8192
free_mib: 2048
camera:
  topic: /camera/image_raw/compressed
  width: 640
  height: 480
  fps: 10
  bitrate_kbps: 1800
  encoder: libx264
  timeout_s: 3
